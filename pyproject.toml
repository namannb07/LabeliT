[project]
name = "annotate"
version = "0.3.0"
description = "ONNX Runtime CPU-based bulk image annotation GUI (YOLO11, RF-DETR)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "LabeliT", email = "contact@example.com" },
]
keywords = ["annotation", "onnx", "windows", "yolo", "object-detection", "dataset"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "onnxruntime>=1.17,<1.24",
    "opencv-python-headless>=4.9",
    "pillow>=10.0",
    "numpy>=1.26",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/LabeliT/LabeliT"
Repository = "https://github.com/LabeliT/LabeliT"
Issues = "https://github.com/LabeliT/LabeliT/issues"

[project.scripts]
annotate = "auto_annotator.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/auto_annotator"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
# Conservative baseline so existing code passes without a stylistic-rewrite commit.
# Once contributors are landing PRs, expand this with "B" (bugbear), "UP" (pyupgrade),
# "SIM" (simplify), etc. — each new rule should be a deliberate decision.
select = ["E", "F", "I"]
ignore = [
    "E501",   # line-too-long
    "E701",   # multiple-statements-on-one-line — used deliberately in app.py resize logic
    "E741",   # ambiguous variable name (e.g. `l`) — used in comprehensions
    "F841",   # unused local — det_count destructure in yolo parser is documentational
]
