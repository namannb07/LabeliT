name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint & test (CPU-only layers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Create venv
        run: uv venv --python 3.10

      # pycuda is a runtime dependency but requires a CUDA toolchain to build,
      # which is not available on GitHub-hosted runners. We install the package
      # without dependency resolution, then add only the CPU-runnable deps the
      # parser / store / utils layers need. Tests that touch detector.py are
      # marked @pytest.mark.jetson and skipped by default.
      - name: Install package (no deps) + dev/runtime deps for CPU tests
        run: |
          uv pip install --no-deps -e .
          uv pip install \
            "pytest>=8" "pytest-cov>=5" "ruff>=0.6" \
            "numpy>=1.26" "opencv-python-headless>=4.9" "pillow>=10.0"

      - name: Ruff
        run: uv run ruff check .

      - name: Pytest
        run: uv run pytest -v
